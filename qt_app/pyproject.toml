[project]
name = "carm-quest-desktop"
version = "0.1.0"
description = "CARM Quest PyQt6 desktop client"
requires-python = ">=3.8,<3.13"
dependencies = [
    "PyQt6>=6.7,<7",
    "Flask>=2.2,<4",
    "Werkzeug>=2.2,<4",
    "carm>=0.1.20260819",
    "numpy==1.24.4; python_version < '3.9'",
    "numpy==1.26.4; python_version >= '3.9'",
    "scipy==1.10.1; python_version < '3.9'",
    "scipy==1.11.4; python_version >= '3.9'",
    "websocket-client>=1.6,<2",
    "zeroconf>=0.130,<1",
]

[tool.ruff]
line-length = 120
